# Nivesh Guru — full-stack VPS (ShockHosting 2GB-safe defaults)
# MongoDB is external (Atlas). Copy .env.example to .env first.
# First boot uses HTTP (site.http.conf). Switch to TLS per SHOCKHOSTING.md.
services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    mem_limit: 300m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../backend
    mem_limit: 400m
    environment:
      APP_PROCESS: api
      NODE_ENV: production
      TZ: Asia/Kolkata
      HOST: "0.0.0.0"
      API_PORT: "4000"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      OTP_PEPPER: ${OTP_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DATA_ENC_SECRET: ${DATA_ENC_SECRET}
      STORAGE_DIR: /app/data
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MARKET_FEED: ${MARKET_FEED:-simulator}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
    volumes:
      - kyc-storage:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  engine:
    build:
      context: ../backend
    mem_limit: 400m
    environment:
      APP_PROCESS: engine
      NODE_ENV: production
      TZ: Asia/Kolkata
      HOST: "0.0.0.0"
      ENGINE_PORT: "4100"
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      OTP_PEPPER: ${OTP_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DATA_ENC_SECRET: ${DATA_ENC_SECRET}
      STORAGE_DIR: /app/data
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MARKET_FEED: ${MARKET_FEED:-simulator}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ../frontend/trader
      args:
        # Same-origin via nginx: browser calls /api and /ws on this host.
        # Only set these if the UI is on a different public host than the API.
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    mem_limit: 300m
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # First boot / pre-TLS: HTTP. After certbot, switch to ./nginx/site.conf
      # and mount certbot-certs (see DOMAIN.md).
      - ./nginx/site.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - api
      - engine
      - web
    restart: unless-stopped

volumes:
  redis-data:
  kyc-storage:
