# HTTP-only first boot (IP or domain before TLS).
# After certbot: switch compose to mount site.conf instead (see SHOCKHOSTING.md).

upstream api_upstream    { server api:4000;    keepalive 32; }
upstream engine_upstream { server engine:4100; keepalive 32; }
upstream web_upstream    { server web:3000;    keepalive 16; }

server {
  listen 80;
  server_name _;

  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /ws {
    proxy_pass http://engine_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://api_upstream/health;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
