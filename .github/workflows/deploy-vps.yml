# Auto-deploy full stack to ShockHosting VPS on every push to main.
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/simulatortrade_new
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            cd deploy
            # Keep existing .env + docker-compose.override.yml (not in git)
            docker compose build
            docker compose up -d
            docker compose ps
            curl -fsS http://127.0.0.1/health
            echo
            echo "Deploy OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"
